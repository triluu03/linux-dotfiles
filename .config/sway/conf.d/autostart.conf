# Start XDG autostart .desktop files using dex. See also
# https://wiki.archlinux.org/index.php/XDG_Autostart
exec --no-startup-id dex --autostart --environment sway
exec --no-startup-id dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP

exec --no-startup-id waybar
exec --no-startup-id ibus start

# Idle/lock management with swayidle + swaylock. Requires the swayidle and
# swaylock packages.
exec --no-startup-id swayidle -w \
    timeout 300 'swaylock -i /home/triluu/Pictures/lockscreen.jpg' \
    timeout 600 'swaymsg "output * dpms off"' \
    resume 'swaymsg "output * dpms on"' \
    before-sleep 'swaylock -i /home/triluu/Pictures/lockscreen.jpg'

# NetworkManager tray icon (StatusNotifierItem on Wayland).
exec --no-startup-id nm-applet --indicator

# Configure the monitors and wallpaper
exec --no-startup-id ~/.config/sway/scripts/monitor_layout.sh

# Launch apps on fixed workspaces at startup
assign [app_id="com.mitchellh.ghostty"] 1
assign [app_id="google-chrome"] 2

workspace 1 output DP-3
workspace 2 output HDMI-A-1

exec --no-startup-id ghostty
exec --no-startup-id google-chrome-stable
