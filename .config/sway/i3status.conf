general {
        output_format = "i3bar"
        colors = true
        interval = 1
}

# order += "external_script ibus"
order += "ethernet _first_"
# order += "wireless _first_"
order += "memory"
order += "volume master"
order += "time"

ethernet _first_ {
        # format_up = " E: %ip (%speed)"
        format_up = " E: %speed"
        format_down = " E: down"
}

# wireless _first_ {
#         format_up = "W: %essid (%quality)"
#         format_down = "W: down"
# }

memory {
        format = " %used / %total"
}

volume master {
        format = " %volume (%devicename)"
        format_muted = " muted (%devicename)"
        device = "pulse"
}

time {
        format = " %a %Y-%m-%d %H:%M:%S"
}

